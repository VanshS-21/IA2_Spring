server: { port: 8888 }
spring:
  application: { name: config-server }
  profiles: { active: native }
  # spring-boot:run executes from the config-server module directory.
  # The central configuration repository is the sibling at the project root.
  cloud: { config: { server: { native: { search-locations: file:../config-repo } } } }
  security: { user: { name: config, password: configpass } }
