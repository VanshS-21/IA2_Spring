server: { port: 8083 }
spring:
  datasource: { url: jdbc:mysql://localhost:3306/order_db, username: order_user, password: order_pass }
  jpa: { hibernate: { ddl-auto: update }, show-sql: true, properties: { hibernate.dialect: org.hibernate.dialect.MySQLDialect } }
  kafka:
    producer: { key-serializer: org.apache.kafka.common.serialization.StringSerializer, value-serializer: org.springframework.kafka.support.serializer.JsonSerializer }
