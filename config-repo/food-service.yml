server: { port: 8082 }
spring:
  datasource: { url: jdbc:mysql://localhost:3306/food_db, username: food_user, password: food_pass }
  jpa: { hibernate: { ddl-auto: update }, show-sql: true, properties: { hibernate.dialect: org.hibernate.dialect.MySQLDialect } }
  data.redis: { host: localhost, port: 6379 }
  cache: { type: redis, redis: { time-to-live: 600000 } }
app: { welcome-message: "Fresh menu data, centrally configured." }
