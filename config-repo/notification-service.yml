server: { port: 8085 }
spring:
  datasource: { url: jdbc:mysql://localhost:3306/notification_db, username: notification_user, password: notification_pass }
  jpa: { hibernate: { ddl-auto: update }, show-sql: true, properties: { hibernate.dialect: org.hibernate.dialect.MySQLDialect } }
  kafka:
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties: { spring.json.trusted.packages: "*", spring.json.use.type.headers: false, spring.json.value.default.type: com.foodordering.events.OrderCreatedEvent }
